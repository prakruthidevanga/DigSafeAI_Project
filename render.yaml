services:
  - type: web
    name: digsafeai-backend
    env: python
    buildCommand: "npm install --prefix backend && pip install -r backend/ml/requirements.txt"
    startCommand: "node backend/server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: PYTHON_EXECUTABLE
        value: python3
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_REQUEST_SIZE
        value: 10mb
